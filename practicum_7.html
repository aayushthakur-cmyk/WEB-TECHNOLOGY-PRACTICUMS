<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCare - Image Gallery</title>
    <link rel="stylesheet" href="style_7.css">
</head>
<body>

    <header class="site-header">
        <h1>PharmaCare</h1>
        <p>Image Gallery: A Look Inside Our Pharmaceutical Operations</p>
    </header>

    <main class="container">
        <h2 class="gallery-title">Our Company Gallery</h2>

        <section class="gallery">

            <figure class="gallery-item">
                <img src="pharmaceutical-company.jpg" alt="PharmaCare company building">
                <figcaption>
                    <h3>Company Headquarters</h3>
                    <p>The PharmaCare head office, where healthcare products are planned and managed.</p>
                </figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="medicine.jpg" alt="Tablets and capsules products">
                <figcaption>
                    <h3>Tablets and Capsules</h3>
                    <p>Our range of medicines in tablet and capsule forms.</p>
                </figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="research-laboratory.jpg" alt="Scientists working in the research laboratory">
                <figcaption>
                    <h3>Research Laboratory</h3>
                    <p>Our research team studying and developing new pharmaceutical products.</p>
                </figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="manufacturing-facility.jpg" alt="Pharmaceutical manufacturing facility">
                <figcaption>
                    <h3>Manufacturing Facility</h3>
                    <p>The production area where medicines are made and packaged.</p>
                </figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="quality-control.jpg" alt="Quality testing of pharmaceutical products">
                <figcaption>
                    <h3>Quality Control</h3>
                    <p>Raw materials and finished products are tested for quality and safety.</p>
                </figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="packaging.jpg" alt="Packaged medicines ready for distribution">
                <figcaption>
                    <h3>Packaging and Distribution</h3>
                    <p>Finished products are packed and prepared for delivery to customers.</p>
                </figcaption>
            </figure>

        </section>
    </main>

    <footer class="site-footer">
        <p>Contact: info@pharmacare.example</p>
        <p>&copy; 2026 PharmaCare. All rights reserved.</p>
    </footer>

</body>
</html>
